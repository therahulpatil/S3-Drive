version: '3.8'

services:
  # 🔒 Secure Node Express API Proxy Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: s3-drive-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always

  # 🎨 Production React Web Application (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: s3-drive-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
